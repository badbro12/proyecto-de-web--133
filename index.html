<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestion de Proyectos de Investigacion</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark encabezado">
            <div class="container-fluid justify-content-center">
                <span class="navbar-brand titulo-sistema">
                    Gestión de Proyectos de Investigación
                </span>
            </div>
        </nav>
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-3 col-lg-2 bg-light vh-100 p-3">
                    <h5>Menú</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Proyectos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Reportes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-danger" href="#" id="btnLogout">Cerrar Sesión</a>
                        </li>
                    </ul>
                </div>

                <div class="col-md-9 col-lg-10 p-4">
                    <h3 class="mb-4">Dashboard</h3>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h5>Total Proyectos</h5>
                                    <h2>15</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h5>Proyectos Activos</h5>
                                    <h2>10</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h5>Participantes</h5>
                                    <h2>45</h2>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3>Lista de Proyectos</h3>
                        <button class="btn btn-success" id="btnNuevoProyecto">+ Nuevo Proyecto</button>
                    </div>

                    <div class="card shadow-sm mb-4" id="formProyecto">
                        <div class="card-header">Registrar Proyecto</div>
                        <div class="card-body">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label">Nombre del Proyecto</label>
                                    <input type="text" class="form-control" id="nombreProyecto">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Estado</label>
                                    <select class="form-select" id="estadoProyecto">
                                        <option>Activo</option>
                                        <option>En Pausa</option>
                                        <option>Finalizado</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Fecha de Inicio</label>
                                    <input type="date" class="form-control" id="fechaInicio">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Responsable</label>
                                    <input type="text" class="form-control" id="responsableProyecto">
                                </div>
                                <button type="submit" class="btn btn-primary" id="btnGuardarProyecto">Guardar Proyecto</button>
                            </form>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Estado</th>
                                    <th>Fecha Inicio</th>
                                    <th>Responsable</th>
                                </tr>
                            </thead>
                            <tbody id="tablaProyectos">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <script>
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html";
            }
        </script>
        <script src="app.js"></script>
    </body>
</html>
