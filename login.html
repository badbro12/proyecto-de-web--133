<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso — Sistema de Investigación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0f1b35;
      --blue:   #1a3a6b;
      --accent: #3b82f6;
      --teal:   #06b6d4;
      --light:  #f0f6ff;
      --white:  #ffffff;
      --text:   #1e293b;
      --muted:  #64748b;
      --error:  #ef4444;
      --border: #cbd5e1;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--navy);
      color: var(--text);
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(59,130,246,.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(6,182,212,.12) 0%, transparent 60%);
      animation: pulse 8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes pulse {
      from { opacity: .7; }
      to   { opacity: 1; }
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    /* Grid background lines */
    .page::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 48px 40px;
      backdrop-filter: blur(16px);
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 64px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
      animation: slideUp .5s ease both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(59,130,246,.4);
    }
    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1.2;
    }
    .logo-sub {
      font-size: .7rem;
      font-weight: 400;
      color: rgba(255,255,255,.4);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: .875rem;
      color: rgba(255,255,255,.4);
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: rgba(255,255,255,.6);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      opacity: .5;
      pointer-events: none;
    }
    input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: .95rem;
      transition: border-color .2s, background .2s, box-shadow .2s;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,.25); }
    input:focus {
      border-color: var(--accent);
      background: rgba(59,130,246,.08);
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }

    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      border: none;
      border-radius: 10px;
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 8px 24px rgba(59,130,246,.35);
      letter-spacing: .02em;
    }
    .btn-login:hover  { opacity: .9; transform: translateY(-1px); box-shadow: 0 12px 32px rgba(59,130,246,.45); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .error-msg {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: .875rem;
      text-align: center;
      display: none;
      animation: shake .3s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    .hint {
      margin-top: 20px;
      padding: 10px 14px;
      background: rgba(59,130,246,.08);
      border: 1px solid rgba(59,130,246,.2);
      border-radius: 8px;
      font-size: .8rem;
      color: rgba(255,255,255,.4);
      text-align: center;
    }
    .hint strong { color: rgba(255,255,255,.7); }
  </style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-icon">🔬</div>
      <div>
        <div class="logo-text">InvestigaHub</div>
        <div class="logo-sub">Sistema de Gestión</div>
      </div>
    </div>

    <h1>Bienvenido</h1>
    <p class="subtitle">Ingresa tus credenciales para continuar</p>

    <form id="formLogin">
      <div class="field">
        <label>Correo electrónico</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="text" id="usuario" placeholder="admin@example.com" autocomplete="email" required />
        </div>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Iniciar sesión</button>
      <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos</div>
    </form>

    <div class="hint">
      Demo: <strong>admin@example.com</strong> / <strong>admin123</strong>
    </div>
  </div>
</div>

<script>
  // If already logged in, redirect
  if (localStorage.getItem('token')) {
    window.location.href = 'index.html';
  }

  document.getElementById('formLogin').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const errEl = document.getElementById('errorMsg');
    const email = document.getElementById('usuario').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Verificando...';
    errEl.style.display = 'none';

    try {
      const res = await fetch('http://localhost:5000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));
        window.location.href = 'index.html';
      } else {
        errEl.textContent = data.error || 'Usuario o contraseña incorrectos';
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = '⚠️ No se puede conectar al servidor. Verifica que Flask esté corriendo.';
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión';
    }
  });
</script>
</body>
</html>
